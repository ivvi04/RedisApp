# Имя приложения: используется в логах, метриках и именах компонентов Spring.
spring.application.name=RedisApp

# Импорт локального .env как источника свойств.
# Префикс optional: означает, что приложение не упадёт, если файла .env нет.
spring.config.import=optional:file:.env[.properties]

# Порт встроенного HTTP-сервера. Значение берётся из переменной APP_PORT (.env).
server.port=${APP_PORT}

# PostgreSQL Configuration
# JDBC URL собирается из переменных окружения: хост, порт и имя базы.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
# Логин и пароль пользователя БД (из .env).
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
# Класс JDBC-драйвера PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase
# Путь к главному changelog-файлу со списком миграций (в classpath).
spring.liquibase.change-log=db/changelog/changelog-master.xml
# Схема БД по умолчанию, в которой применяются миграции (из .env).
spring.liquibase.default-schema=${POSTGRES_SCHEMA}

# Redis Configuration
# Хост и порт Redis-сервера (из .env).
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
# Пароль для аутентификации в Redis; пустое значение — без пароля.
spring.data.redis.password=${REDIS_PASSWORD}
# Таймаут выполнения команды: 10000ms = 10 секунд.
spring.data.redis.timeout=10000ms

# Пул соединений Lettuce.
# Максимальное число одновременных соединений в пуле.
spring.data.redis.lettuce.pool.max-active=8
# Максимальное ожидание свободного соединения; -1ms = ждать бесконечно.
spring.data.redis.lettuce.pool.max-wait=-1ms
# Максимальное число простаивающих (idle) соединений, которые держит пул.
spring.data.redis.lettuce.pool.max-idle=8
# Минимальное число простаивающих соединений, которые пул поддерживает.
spring.data.redis.lettuce.pool.min-idle=8
