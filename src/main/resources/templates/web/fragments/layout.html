<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">RedisApp</title>
    <link rel="stylesheet" th:href="@{/web/css/style.css}">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const path = location.pathname;
            document.querySelectorAll('[data-nav]').forEach(link => {
                const href = link.getAttribute('href');
                if (href === path || (href !== '/' && path.startsWith(href))) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="logo">R</span>
        <span class="brand-text">
            <span class="brand-name">RedisApp</span>
            <span class="brand-caption">messenger</span>
        </span>
    </a>
    <nav class="main-nav">
        <a data-nav th:href="@{/}">Обзор</a>
        <a data-nav th:href="@{/users}">Пользователи</a>
        <a data-nav th:href="@{/chats}">Чаты</a>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="user-box" th:if="${currentUser != null}">
        <span class="avatar sm"
              th:text="${#strings.toUpperCase(#strings.substring(currentUser.username, 0, 1))}">U</span>
        <span class="user-meta">
            <span class="user-name" th:text="${currentUser.username}">Пользователь</span>
            <span class="user-email" th:text="${currentUser.email}">user@example.com</span>
        </span>
        <form class="logout-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn ghost small" type="submit" title="Выйти из аккаунта">Выйти</button>
        </form>
    </div>
</header>

<div th:replace="${content}"></div>

<footer class="footer">
    <span>RedisApp · Spring Boot + Redis + Thymeleaf</span>
    <span class="footer-dot">•</span>
    <span>сессии и кеш хранятся в Redis</span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script th:src="@{/web/js/api.js}"></script>
<script th:replace="${scripts}"></script>
</body>
</html>
