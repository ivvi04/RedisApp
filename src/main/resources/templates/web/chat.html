<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{web/fragments/layout :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>Чат — RedisApp</title>
</head>
<body>
<main class="container" th:attr="data-chat-id=${chatId}, data-is-admin=${isAdmin}">
    <section class="page-head">
        <div>
            <p class="eyebrow"><a class="link" th:href="@{/chats}">← Все чаты</a></p>
            <h1 id="chatTitle">Чат #<span th:text="${chatId}">0</span></h1>
            <p class="muted" id="chatSubtitle">Загрузка…</p>
        </div>
        <div class="hero-actions">
            <span class="chip" title="Вы вошли под этим аккаунтом">
                <span class="avatar xs" id="currentUserAvatar">?</span>
                <span class="chip-text">
                    <span id="currentUserName">Загрузка…</span>
                    <span class="chip-sub" id="currentUserEmail"></span>
                </span>
            </span>
            <button class="btn danger" id="deleteChatBtn" type="button">Удалить чат</button>
        </div>
    </section>

    <section class="split chat-layout">
        <aside class="card">
            <div class="card-head">
                <h2>Участники</h2>
                <span class="badge" id="membersCount">0</span>
            </div>
            <ul class="member-list" id="membersList">
                <li class="muted small">Загрузка…</li>
            </ul>
            <form class="form compact-form" id="memberForm">
                <label>Добавить участника
                    <select id="memberToAdd"></select>
                </label>
                <button class="btn primary" type="submit">Добавить</button>
            </form>
        </aside>

        <section class="card messages-card">
            <div class="card-head">
                <div>
                    <h2>Сообщения</h2>
                    <p class="muted small">Отправка выполняется от вашего аккаунта</p>
                </div>
                <form class="inline-form" id="searchForm">
                    <input type="search" id="searchQuery" placeholder="Поиск по чату">
                    <button class="btn ghost" type="submit">Найти</button>
                    <button class="btn ghost" id="clearSearchBtn" type="button" hidden>Сбросить</button>
                </form>
            </div>

            <div class="messages" id="messages">
                <p class="empty">Загрузка…</p>
            </div>

            <form class="message-form" id="messageForm">
                <textarea id="messageContent" maxlength="1000" rows="2"
                          placeholder="Введите сообщение…" required></textarea>
                <button class="btn primary" type="submit">Отправить</button>
            </form>
        </section>
    </section>
</main>
<script th:src="@{/web/js/chat.js}"></script>
</body>
</html>
