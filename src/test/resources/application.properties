# Конфигурация для тестов: H2 вместо PostgreSQL и без подключения к реальному Redis.
spring.application.name=RedisAppTest

# H2 в режиме совместимости с PostgreSQL.
spring.datasource.url=jdbc:h2:mem:redisapp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS redis_app
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Схему и таблицы создаёт Hibernate, Liquibase для тестов не нужен.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false
spring.liquibase.enabled=false

# Redis-репозитории и сессии не используются в тестах.
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration

# Если код всё же обратится к Redis, он не должен попасть в реальный экземпляр.
spring.data.redis.host=localhost
spring.data.redis.port=1
spring.data.redis.timeout=100ms
