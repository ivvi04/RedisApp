version: '3.8'

services:

  postgres:
    image: postgres:18.6-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=redisapp
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/main/resources/db/changelog/baseline/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - redis-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "6379:6379"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - redis-net

  redis-app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    #    environment:
    #      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/redisapp
    #      - SPRING_DATA_REDIS_HOST=redis
    #      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - redis-net

volumes:
  postgres_data:
  redis_data:

networks:
  redis-net:
    driver: bridge